# CI —— 每次 push / PR 都跑。
#
# 加它的理由：在此之前"测试全绿"完全依赖人工跑一遍。
# 于是下面这类事没有任何门禁拦得住：
#   - compose 的 build.context 指向一个已改名的目录（真的发生过，
#     P0-1，compose 在构建第一步就失败）
#   - 删掉一个配置项但没清 .env（真的发生过，P0-2 的连带问题）
#   - 覆盖率悄悄掉了
#
# 两个 job 的分工：
#   backend        —— 跑测试 + 覆盖率门禁 + 语法编译检查
#   compose-config —— 只解析 docker-compose.yml，不构建镜像
#
# 为什么 compose 只做 `config` 而不构建：构建要拉基础镜像 + pip install
# 几十个包，几分钟起步，而且和 backend job 的验证内容高度重合。
# `compose config` 恰好能抓住 P0-1 那一类问题（路径解析、变量插值），
# 成本是几秒。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支的新提交取消上一次未跑完的任务 —— 避免"排队等旧提交"。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试与覆盖率
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的基础镜像保持一致。不一致的话会出现
          # "容器里能跑、CI 上不行"这类最难查的差异。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法编译检查
        # 比等测试跑到一半报 ImportError 快得多，失败信息也更直白。
        run: python -m compileall -q .

      - name: 跑测试 + 覆盖率门禁
        # 覆盖率门槛（fail_under = 83）写在 pyproject.toml 里，
        # 低于门槛时 pytest 会以非零码退出 —— 不需要额外判断。
        run: pytest --cov --cov-report=term-missing
        env:
          # ⚠️ 刻意不提供任何 LLM 凭据。
          #
          # 这不是"忘了配"，而是被验证的性质本身：整套测试必须【离线】
          # 跑绿。曾经这里会直接失败 —— main.py 在模块级构造 LLM 客户端，
          # openai SDK 缺凭据时在【构造期】抛错，于是连测试收集都过不去：
          #     ERROR tests/test_api.py - openai.OpenAIError: Missing credentials
          # 一个全新 clone 下来的人就是这样被挡在门外的。
          # 这条 env 是那个回归的守卫：谁再把凭据变成测试的前提，CI 会红。
          ECOM_LLM_API_KEY: ""

  compose-config:
    name: compose 配置可解析
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 解析 docker-compose.yml
        # `config` 会做插值与路径解析，但【不】构建镜像。
        # P0-1 那类"context 指向不存在的目录"的问题在这里就会暴露。
        #
        # 注意它同时验证了 env_file 是被正确读到还是被 environment 覆盖 ——
        # 曾经 environment 里的 `${VAR:-}` 展开成空串把 .env 的真实值盖掉，
        # 表面看 compose 文件"配得很全"，实际把 API Key 抹成了空。
        run: docker compose config
